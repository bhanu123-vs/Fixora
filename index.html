<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixora - Campus & Hostel Issue Reporting & Management</title>
    <meta name="description" content="Report It. Track It. Fix It. Fixora is a centralized digital campus and hostel issue reporting and management platform." />
    <meta property="og:title" content="Fixora - Campus & Hostel Issue Management" />
    <meta property="og:description" content="Report It. Track It. Fix It. Transparent campus facility issue reporting for students and administrators." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      (function () {
        try {
          var t = localStorage.getItem('fixora_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
